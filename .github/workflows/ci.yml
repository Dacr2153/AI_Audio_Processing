name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-typecheck:
    name: Lint + Type-check (ruff, mypy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev deps
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests
      - name: Mypy
        run: mypy src/audio_restoration

  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install ffmpeg (lossy I/O tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov=audio_restoration --cov-report=term-missing

  setup_script:
    name: setup.sh smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run setup.sh (core + dev, no neural)
        run: bash setup.sh --skip-neural --dev
      - name: Verify CLI entry point
        run: |
          source venv_audio/bin/activate
          audio-restore --help
      - name: Run check mode
        run: bash setup.sh --check

  package_build:
    name: Build package (wheel + sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: pip install build
      - name: Build wheel and sdist
        run: python -m build
      - name: Inspect artifacts
        run: |
          python - <<'EOF'
          import re, tarfile, zipfile, glob
          version = re.search(r'__version__ = "([^"]+)"',
                              open("src/audio_restoration/_version.py").read()).group(1)
          sdist = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(sdist) as t:
              names = t.getnames()
          assert any(n.endswith("LICENSE") for n in names), "LICENSE missing in sdist"
          assert any(n.endswith("py.typed") for n in names), "py.typed missing in sdist"
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as z:
              wnames = z.namelist()
          assert any(f"audio_restoration-{version}.dist-info" in n for n in wnames), "dist-info version mismatch"
          assert any("_version.py" in n for n in wnames), "_version.py missing in wheel"
          print(f"artifacts OK ({version}):", sdist, wheel)

  shellcheck:
    name: Shellcheck (setup.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: bewuethr/shellcheck-action@v2
        with:
          scandir: '.'
          severity: warning