name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-typecheck:
    name: Lint + Type-check (ruff, mypy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev deps
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests
      - name: Mypy
        run: mypy src/audio_restoration

  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install ffmpeg (lossy I/O tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov=audio_restoration --cov-report=term-missing

  setup_script:
    name: setup.sh smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run setup.sh (CPU)
        run: bash setup.sh --check

  shellcheck:
    name: Shellcheck (setup.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: bewuethr/shellcheck-action@v2
        with:
          scandir: '.'
          severity: warning